name: Build & Release (Windows)

# كل دفع على main يبني المثبّت وينشره بالإصدارات حسب رقم النسخة بـ package.json
# للتحديث: غيّر "version" بـ package.json وادفع → إصدار جديد تلقائياً
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm install

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-RESCUE-${{ steps.ver.outputs.v }}-windows
          path: dist/*.exe

      - name: Publish release v${{ steps.ver.outputs.v }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: IBRA RESCUE v${{ steps.ver.outputs.v }} — حبل النجاة
          make_latest: true
          files: dist/*.exe
          body: |
            ## IBRA RESCUE — حبل النجاة 🚁
            لعبة إنقاذ بالهليكوبتر والحبل — 10 مهمات بمدن العالم، عربي وإنكليزي.

            ### التحميل
            - **IBRA-RESCUE-${{ steps.ver.outputs.v }}-Setup.exe** ← المثبّت (ينصّب اللعبة ويسوي اختصار على سطح المكتب)
            - **IBRA-RESCUE-${{ steps.ver.outputs.v }}-portable.exe** ← نسخة محمولة تشتغل بدون تنصيب

            برمجة وتطوير إبراهيم الخزرجي · Telegram: t.me/ibraprogram · TikTok: @ibraprogram
