name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-RESCUE-windows
          path: |
            dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: IBRA RESCUE ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            ## IBRA RESCUE — حبل النجاة 🚁
            - **IBRA-RESCUE-…-nsis.exe** ← المثبّت (ينصّب اللعبة ويسوي اختصار على سطح المكتب)
            - **IBRA-RESCUE-…-portable.exe** ← نسخة محمولة تشتغل بدون تنصيب
