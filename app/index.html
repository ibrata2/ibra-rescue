<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>IBRA RESCUE — حبل النجاة</title>
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#0b0a09; --panel:rgba(14,12,10,.86); --line:#3a342c; --cream:#ebe1c8; --dim:#9b927f;
  --gold:#c9a84c; --gold2:#f0d78a; --red:#c8323c;
  --font: Tahoma, "Segoe UI", "Noto Sans Arabic", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--font);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;touch-action:none}
button{font-family:var(--font);cursor:pointer}

/* ---------- الشاشات ---------- */
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:flex}

/* العنوان */
#title{flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#title .logo{width:min(150px,20vh);height:auto;filter:drop-shadow(0 10px 30px rgba(201,168,76,.25));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
#title h1{font-family:"Courier New",monospace;font-size:clamp(34px,7vw,72px);letter-spacing:.12em;line-height:1;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#7d6224);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 0 transparent;filter:drop-shadow(0 3px 0 #000)}
#title h2{font-size:clamp(20px,3.6vw,34px);color:var(--cream);font-weight:bold;margin-top:-6px}
#title .tag{color:var(--dim);font-size:14px;max-width:520px;line-height:1.7}
.btns{display:flex;flex-direction:column;gap:8px;width:min(320px,86vw)}
@media (max-height:780px){ #title .tag{display:none} .btn{padding:10px 18px} }
.btn{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));border:2px solid var(--line);color:var(--cream);
  padding:13px 18px;font-size:17px;font-weight:bold;border-radius:10px;transition:.15s;backdrop-filter:blur(6px)}
.btn:hover,.btn:focus-visible{border-color:var(--gold);color:var(--gold2);outline:none;transform:translateY(-1px)}
.btn.main{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;border-color:var(--gold);font-size:20px}
.btn.main:hover{filter:brightness(1.08);color:#1a1408}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.credit{text-align:center;font-size:12px;color:var(--dim);line-height:1.8;margin-top:2px}
.credit a{color:var(--gold);text-decoration:none;margin:0 6px}

/* خريطة المهمات */
#map{align-items:stretch;justify-content:center;gap:18px;padding:18px;flex-wrap:wrap;overflow:auto}
.globeWrap{flex:1 1 380px;max-width:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:260px;position:relative}
#globe{width:min(100%,62vh);aspect-ratio:1;display:block}
.globeWrap .mhead{font-family:"Courier New",monospace;letter-spacing:.2em;color:var(--dim);font-size:13px;margin-bottom:6px}
.side{flex:1 1 360px;max-width:520px;display:flex;flex-direction:column;gap:12px;min-width:280px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
#mlist{display:flex;flex-direction:column;gap:6px;max-height:27vh;overflow:auto;padding:2px}
#mlist::-webkit-scrollbar{width:6px}#mlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.mcard{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid transparent;color:var(--cream);padding:8px 12px;border-radius:9px;text-align:start}
.mcard:hover{background:rgba(255,255,255,.07)}
.mcard.sel{border-color:var(--gold);background:rgba(201,168,76,.1)}
.mcard.locked{opacity:.45}
.mcard .mn{font-family:"Courier New",monospace;color:var(--gold);font-weight:bold;font-size:15px}
.mcard .mt{flex:1;display:flex;flex-direction:column}
.mcard .mt b{font-size:15px}.mcard .mt small{color:var(--dim);font-size:12px}
.mcard .ms{color:var(--gold);letter-spacing:2px;font-size:14px}
#mTitle{font-size:20px;color:var(--gold2);margin-bottom:6px}
#mDesc{font-size:14px;line-height:1.8;color:var(--cream);min-height:50px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:13px}
.meta div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.meta span{color:var(--dim)}
#mLock{color:var(--red);font-size:13px;min-height:16px;margin-top:6px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.how{font-size:12.5px;color:var(--dim);line-height:1.7}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;z-index:4;pointer-events:none;padding:10px 12px;gap:8px;align-items:flex-start;justify-content:space-between}
#hud.on{display:flex}
.hbox{background:rgba(10,9,8,.72);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:bold;display:flex;align-items:center;gap:8px;font-size:15px;backdrop-filter:blur(4px)}
.hbox small{color:var(--dim);font-weight:normal;font-size:12px}
#hudCity{font-size:13px;color:var(--gold2)}
#hudTime{font-family:"Courier New",monospace;font-size:18px}
#hudTime.low{color:var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.pop{animation:pop .45s}
@keyframes pop{30%{transform:scale(1.25);border-color:var(--gold)}}
.hgroup{display:flex;gap:8px;flex-wrap:wrap}
#btnPause{pointer-events:auto;background:rgba(10,9,8,.72);border:1px solid var(--line);color:var(--cream);width:40px;height:36px;border-radius:10px;font-size:16px}
.ico{display:inline-block;width:10px;height:14px;position:relative}
.ico::before{content:"";position:absolute;left:3px;top:0;width:4px;height:4px;background:currentColor}
.ico::after{content:"";position:absolute;left:4px;top:5px;width:2px;height:9px;background:currentColor;box-shadow:-3px 1px 0 -0px currentColor,3px 1px 0 0 currentColor}

#radio{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);z-index:4;background:rgba(10,9,8,.85);border:1px solid var(--gold);color:var(--cream);
  padding:8px 16px;border-radius:8px;font-size:15px;font-weight:bold;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#radio.show{opacity:1;transform:translate(-50%,0)}
#howto{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:4;color:var(--dim);font-size:13px;opacity:0;transition:.6s;pointer-events:none;text-align:center;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:6px}
#howto.show{opacity:1}

/* الإيقاف والنتيجة */
.overlay{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);padding:16px}
.overlay.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(420px,94vw);text-align:center;display:flex;flex-direction:column;gap:12px;animation:in .35s}
@keyframes in{from{transform:translateY(20px) scale(.96);opacity:0}}
.card h3{font-size:26px;color:var(--gold2)}
#result:not(.win) .card h3{color:var(--red)}
#rStars{font-size:44px;color:var(--gold);letter-spacing:6px;min-height:0}
#rLine{font-size:16px;color:var(--cream);font-style:italic}
#rStats{display:flex;flex-direction:column;gap:4px;font-size:14px}
#rStats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 2px}
#rStats span{color:var(--dim)}
#rAll{color:var(--gold2);font-weight:bold}

.about{gap:8px}
.aLogo{width:96px;height:96px;margin:0 auto}
.aSub{color:var(--cream);font-weight:bold;margin-top:-6px}
.aVer{color:var(--dim);font-size:13px}.aVer b{color:var(--gold2);font-family:"Courier New",monospace}
.aDesc{font-size:14px;line-height:1.8;color:var(--cream)}
.aCredit{font-size:17px;font-weight:bold;color:var(--gold2);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.aFollow{font-size:12.5px;color:var(--dim)}
.btn.link{text-decoration:none;font-size:15px;direction:ltr}

.chbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--gold2);font-size:24px;line-height:1}
.chbtn:disabled{opacity:.3}
.chbtn:hover:not(:disabled){border-color:var(--gold)}
.chinfo{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.chinfo b{color:var(--gold2);font-size:15px}.chinfo small{color:var(--dim);font-size:12px}
.mcard .mi{font-size:16px}
.meta .full{grid-column:1/-1}
.upd{font-size:12.5px;color:var(--dim);padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);cursor:default;direction:inherit}
#title .upd{margin-top:-4px}
.upd.ok{color:#8fbf7a;border-color:#3b4a33}
.upd.new{color:#1a1408;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);font-weight:bold;cursor:pointer;animation:pulse 1.6s infinite}
.upd.fail{color:var(--dim)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(201,168,76,.18)}}

/* اختيار الطيارة */
.hpTitle{margin-top:12px;font-size:13px;color:var(--dim)}
#heliPick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.hcard{position:relative;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:5px 2px 4px;color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:2px}
.hcard canvas{width:100%;max-width:72px;image-rendering:pixelated}
.hcard .hn{font-size:11px;white-space:nowrap}
.hcard.sel{border-color:var(--gold);background:rgba(201,168,76,.14)}
.hcard.locked{opacity:.38}
.hcard .hrec{position:absolute;top:-7px;inset-inline-start:4px;background:var(--gold);color:#1a1408;font-size:9px;font-weight:bold;padding:0 4px;border-radius:4px}
#heliInfo{font-size:12px;color:var(--gold2);margin-top:6px;min-height:16px;direction:inherit}
@media (max-width:520px){ #heliPick{grid-template-columns:repeat(3,1fr)} }

/* أزرار الحبل */
#reel{position:fixed;right:14px;bottom:80px;z-index:6;display:none;flex-direction:column;gap:10px}
#hud.on ~ #reel{display:flex}
#reel button{width:58px;height:58px;border-radius:14px;border:1px solid var(--gold);background:rgba(10,9,8,.7);color:var(--gold2);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#reel button small{font-size:10px;color:var(--dim)}
@media (pointer:fine){ #reel button{width:44px;height:44px;font-size:16px;opacity:.75} }

/* عصا اللمس */
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(235,225,200,.35);background:rgba(0,0,0,.2);z-index:6;display:none;pointer-events:none}
#stick.show{display:block}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(201,168,76,.6);border:2px solid var(--gold2)}

@media (max-height:520px){ #title .logo{width:90px} #title{gap:8px} .credit{display:none} #mlist{max-height:28vh} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- شاشة العنوان -->
<section class="screen" id="title">
  <img class="logo" src="icon.svg" alt="">
  <h1>IBRA RESCUE</h1>
  <h2 data-t="subtitle"></h2>
  <p class="tag" data-t="howto"></p>
  <div class="btns">
    <button class="btn main" id="btnPlay" data-t="play"></button>
    <button class="btn" id="btnLang" data-t="langBtn"></button>
    <button class="btn" id="btnSound"></button>
    <button class="btn" id="btnAbout" data-t="about"></button>
  </div>
  <div class="upd"></div>
  <div class="credit">
    <div data-t="credit"></div>
    <div><a href="https://t.me/ibraprogram" data-ext>Telegram: t.me/ibraprogram</a> · <a href="https://www.tiktok.com/@ibraprogram" data-ext>TikTok: @ibraprogram</a></div>
  </div>
</section>

<!-- خريطة المهمات -->
<section class="screen" id="map">
  <div class="globeWrap">
    <div class="mhead">IBRA RESCUE · <span data-t="missions"></span></div>
    <canvas id="globe"></canvas>
  </div>
  <div class="side">
    <div class="panel">
      <div class="chbar"><button class="chbtn" id="chPrev">‹</button><div class="chinfo"><b id="chName"></b><small id="chStars"></small></div><button class="chbtn" id="chNext">›</button></div>
      <div id="mlist"></div>
    </div>
    <div class="panel">
      <div id="mTitle"></div>
      <div id="mDesc"></div>
      <div class="meta">
        <div><span data-t="goal"></span><b id="mGoal"></b></div>
        <div><span data-t="time"></span><b id="mTime"></b></div>
        <div><span data-t="weather"></span><b id="mWeather"></b></div>
        <div class="full"><span data-t="type"></span><b id="mType"></b></div>
      </div>
      <div class="hpTitle" data-t="chooseHeli"></div>
      <div id="heliPick"></div>
      <div id="heliInfo"></div>
      <div id="mLock"></div>
    </div>
    <div class="row">
      <button class="btn" id="btnBack" data-t="back"></button>
      <button class="btn main" id="btnGo" data-t="start"></button>
    </div>
    <p class="how" data-t="controls"></p>
  </div>
</section>

<!-- HUD -->
<div id="hud">
  <div class="hgroup">
    <div class="hbox" id="hudCity"></div>
  </div>
  <div class="hgroup">
    <div class="hbox" id="hudSavedBox"><span class="ico"></span><small data-t="saved"></small><span id="hudSaved"></span></div>
    <div class="hbox"><small data-t="onRope"></small><span id="hudRope"></span></div>
    <div class="hbox"><span id="hudTime"></span></div>
    <button id="btnPause" aria-label="pause">❚❚</button>
  </div>
</div>
<div id="radio"></div>
<div id="howto"></div>
<div id="stick"><div id="knob"></div></div>
<div id="reel"><button id="reelUp" aria-label="reel up">⬆<small>Q</small></button><button id="reelDown" aria-label="reel down">⬇<small>E</small></button></div>

<!-- الإيقاف -->
<div class="overlay" id="pause"><div class="card">
  <h3 data-t="paused"></h3>
  <button class="btn main" id="btnResume" data-t="resume"></button>
  <button class="btn" id="btnRestart" data-t="restart"></button>
  <button class="btn" id="btnMenu" data-t="menu"></button>
</div></div>

<!-- حول -->
<div class="overlay" id="about"><div class="card about">
  <img src="icon.svg" alt="" class="aLogo">
  <h3>IBRA RESCUE</h3>
  <div class="aSub" data-t="subtitle"></div>
  <div class="aVer"><span data-t="version"></span> <b id="appVer"></b></div>
  <div class="upd"></div>
  <p class="aDesc" data-t="aboutDesc"></p>
  <div class="aCredit" data-t="credit"></div>
  <div class="aFollow" data-t="follow"></div>
  <a class="btn link" href="https://t.me/ibraprogram" data-ext>✈️ Telegram · t.me/ibraprogram</a>
  <a class="btn link" href="https://www.tiktok.com/@ibraprogram" data-ext>🎵 TikTok · @ibraprogram</a>
  <button class="btn main" id="btnAboutClose" data-t="close"></button>
</div></div>

<!-- النتيجة -->
<div class="overlay" id="result"><div class="card">
  <h3 id="rTitle"></h3>
  <div id="rStars"></div>
  <div id="rLine"></div>
  <div id="rStats"></div>
  <div id="rAll"></div>
  <button class="btn main" id="btnNext" data-t="next"></button>
  <button class="btn" id="btnRetry" data-t="retry"></button>
  <button class="btn" id="btnMenu2" data-t="menu"></button>
</div></div>

<script src="js/version.js"></script>
<script src="js/text.js"></script>
<script src="js/levels.js"></script>
<script src="js/missions.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
