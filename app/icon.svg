    <!-- ماي -->
    <rect x="24" y="440" width="464" height="60" fill="#0e0e10" opacity="0.9"/>
    <g fill="#7a7366"><rect x="40" y="446" width="30" height="4"/><rect x="120" y="452" width="40" height="4"/><rect x="330" y="448" width="36" height="4"/><rect x="420" y="456" width="30" height="4"/></g>

    <!-- الحبل -->
    <path d="M250 214 C 246 260, 262 300, 254 350" stroke="#ebe1c8" stroke-width="7" fill="none" shape-rendering="geometricPrecision"/>
